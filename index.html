<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>

:root[data-theme="dark"]{--bg:#0e1017;--sf:#171a25;--sf2:#212534;--tx:#eef0fa;--mu:#8e95b0;--bd:#2a2f42;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
nav{display:none;position:fixed;z-index:20;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100% - 24px));padding:6px;border-radius:30px;background:color-mix(in srgb,var(--sf) 52%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid color-mix(in srgb,var(--tx) 16%,transparent);box-shadow:0 12px 32px #0005,inset 0 1px 0 #ffffff30}nav.show{display:flex;animation:navin .7s cubic-bezier(.2,.9,.3,1.2)}@keyframes navin{from{transform:translate(-50%,160%)}}.pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/7);border-radius:24px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 4px 16px #7c5cff77;transform:translateX(calc(var(--i,0)*100%));transition:transform .55s cubic-bezier(.34,1.45,.64,1)}

nav button{position:relative;z-index:1;padding:9px 2px}nav button span{font-size:20px;transition:transform .3s}nav button.on{color:#fff}nav button.on span{transform:translateY(-2px) scale(1.15)}nav button:active span{transform:scale(.8)}
main{max-width:480px;margin:0 auto;padding:14px 14px 120px;animation:pin .55s cubic-bezier(.2,.8,.2,1)}main.out{animation:pout .2s ease forwards}main.still,main.still>*{animation:none!important}@keyframes pin{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes pout{to{opacity:0;transform:translateY(-14px) scale(.98);filter:blur(6px)}}

h1{font-size:22px}h2{font-size:17px}.mu{color:var(--mu);font-size:13px}.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;animation:pop .5s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0002}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:9px 16px;border-radius:12px;font-weight:600;transition:.15s;white-space:nowrap}.btn:hover{transform:scale(1.04)}.btn:active{transform:scale(.96)}
.btn.g{background:var(--sf2);color:var(--tx)}.btn.ok{background:var(--ok)}.btn[disabled]{opacity:.5;pointer-events:none}.btn.w{width:100%;margin-top:8px}
.av{width:46px;height:46px;border-radius:50%;background:var(--sf2);display:grid;place-items:center;font-size:24px;flex:none}
.chip{padding:6px 12px;border-radius:99px;background:var(--sf2);font-size:13px;white-space:nowrap;transition:.15s}.chip.on{background:var(--ac);color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.stats div{background:var(--sf2);border-radius:10px;padding:6px 2px;text-align:center;min-width:0}.stats b{display:block;font-size:14px}.stats small{font-size:10px;color:var(--mu)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--sf2);color:var(--mu);white-space:nowrap}.rk{background:var(--ac);color:#fff}
.stars{color:#ffb020;white-space:nowrap}.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=text],textarea,select{width:100%;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px;font:inherit}textarea{resize:none;height:70px}
input[type=range]{width:100%;accent-color:var(--ac)}
.story{flex:none;width:64px;text-align:center;font-size:11px}.story i{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;margin:0 auto 3px;font-style:normal;font-size:26px;background:var(--sf);border:3px solid transparent;background-clip:padding-box;outline:3px solid var(--ac2);outline-offset:1px}
.img{height:170px;border-radius:12px;display:grid;place-items:center;font-size:48px;margin:10px 0}
.toast{position:fixed;z-index:80;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:90vw;animation:pop .25s;text-align:center}
#modal{position:fixed;z-index:70;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px}#modal.on{display:flex}#modal>div{background:var(--sf);border-radius:20px;padding:20px;max-width:420px;width:100%;max-height:88vh;overflow:auto;animation:pop .25s}
.ring{width:150px;height:150px;border-radius:50%;margin:18px auto;display:grid;place-items:center;font-size:60px;border:4px dashed var(--ac);animation:spin 3s linear infinite}.ring s{text-decoration:none;animation:spin 3s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:8px;background:var(--sf2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.blur{filter:blur(7px);pointer-events:none;user-select:none}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;margin:4px 0;overflow-wrap:anywhere}.me{background:var(--ac);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.th{background:var(--sf2);border-bottom-left-radius:4px}
.hero{min-height:420px;display:grid;place-items:center;text-align:center}.btn{position:relative;overflow:hidden}.btn::after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff50 50%,transparent 70%);transform:translateX(-100%);animation:sh 3.5s infinite}@keyframes sh{to{transform:translateX(100%)}}.story i{animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{outline-color:var(--ac);transform:scale(1.07)}}.chip.on{animation:bump .3s}@keyframes bump{50%{transform:scale(1.15)}}.av{transition:transform .25s}.card:hover .av{transform:rotate(-8deg) scale(1.08)}.chip{transition:.2s}.chip:active{transform:scale(.9)}@media(min-width:900px){main{max-width:860px}#pl{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}nav{width:520px}.img{height:260px}}@media(max-width:699px){#dv{display:none}}#dv{position:fixed;z-index:30;top:calc(10px + env(safe-area-inset-top,0px));right:12px;background:var(--sf);border:1px solid var(--bd)}html.phone #app{max-width:390px;margin:20px auto;height:min(780px,calc(100vh - 40px));border:12px solid #1b1b20;border-radius:46px;overflow:auto;position:relative;box-shadow:0 20px 50px #0006}html.phone main{max-width:none}html.phone #pl{display:block}html.phone nav{width:340px;bottom:38px}html.phone .img{height:170px}
nav button.plus{padding:9px 0;justify-content:center}nav button.plus span{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;width:46px;height:34px;border-radius:14px;display:grid;place-items:center;font-size:24px;line-height:1;box-shadow:0 4px 14px #7c5cff66}
.tg{width:46px;height:26px;border-radius:99px;background:var(--sf2);position:relative;transition:.25s;flex:none}.tg i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 1px 4px #0004}.tg.on{background:var(--ok)}.tg.on i{transform:translateX(20px)}.srow{padding:10px 0;border-top:1px solid var(--bd)}
.story.seen i{outline-color:var(--bd);animation:none}.img{overflow:hidden}.fr,.sm,.img{container-type:inline-size;position:relative}
#cr,#sv{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:none}#cr.on,#sv.on{display:block;animation:pin .35s}
#cr>div{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#cr .chip,#sv .chip{background:#ffffff26;color:#fff}#cr .chip.on{background:var(--ac)}#cr input[type=text],#sv input[type=text]{background:#ffffff1f;color:#fff;border-color:#ffffff40}
.fr{flex:1 1 0;min-height:0;aspect-ratio:9/16;align-self:center;max-width:100%;background:#111;border-radius:18px;overflow:hidden}
.tp{min-height:110px;max-height:30vh;overflow:auto;background:#ffffff14;border-radius:16px;padding:10px}
.sk{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.sk button{padding:6px 2px;border-radius:12px;background:#ffffff1a;min-width:0;overflow:hidden;color:#fff}
#cv{flex:1;min-height:0;width:100%;object-fit:cover;border-radius:18px;background:#111}
.shut{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#ffffff33;flex:none}.shut.rec{background:#ff2d2d;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(.9)}}
.ovw{position:absolute;inset:0;pointer-events:none}.ov{position:absolute;transform:translate(-50%,-50%);touch-action:none;cursor:grab;text-shadow:0 2px 8px #0009;white-space:nowrap;font-weight:700;user-select:none;pointer-events:auto}#sv .ov,.img .ov{pointer-events:none}
#sv .svc{position:relative;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
.sbars{display:flex;gap:4px}.sbars i{flex:1;height:3px;background:#ffffff40;border-radius:3px;overflow:hidden}.sbars b{display:block;height:100%;background:#fff}
.sm{flex:1;min-height:0;border-radius:16px;overflow:hidden;background:#111}.gs{height:100%;display:grid;place-content:center;text-align:center;gap:12px}.gt{font-size:24px;font-weight:800;padding:0 20px}
#dc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none}.fr.dm #dc{pointer-events:auto;cursor:crosshair}.fr.dm .ov{pointer-events:none}.dr{position:absolute;inset:0;width:100%;height:100%}.tz{position:absolute;top:0;bottom:0;width:50%}.tz.l{left:0}.tz.r{right:0}.sr input{flex:1}
</style></head><body>
<div id="app"></div><nav id="nav"></nav><button id="dv" class="chip">📱 Phone view</button><div id="cr"></div><div id="sv"></div><div id="modal"></div>
<script>
const RK=['Iron','Bronze','Silver','Gold','Platinum','Diamond','Ascendant','Immortal'];
const PL=[
{n:'NovaKai',e:'🦊',r:6,kd:1.42,adr:162,hs:28,wr:57,acs:251,rt:4.8,rv:63,role:'Duelist'},
{n:'SageMain_Riya',e:'🌸',r:5,kd:1.18,adr:141,hs:24,wr:54,acs:212,rt:4.9,rv:41,role:'Support'},
{n:'ViperVik',e:'🐍',r:7,kd:1.55,adr:171,hs:31,wr:61,acs:268,rt:4.6,rv:88,role:'Controller'},
{n:'ClutchOrNothing',e:'🎯',r:3,kd:1.05,adr:128,hs:19,wr:49,acs:187,rt:3.7,rv:19,role:'Flex'},
{n:'JettJunkie',e:'⚡',r:4,kd:1.24,adr:149,hs:26,wr:53,acs:226,rt:4.5,rv:34,role:'Duelist'},
{n:'SentinelSam',e:'🛡️',r:5,kd:1.12,adr:136,hs:22,wr:56,acs:205,rt:4.7,rv:52,role:'Sentinel'}];
const GR=[{n:'Night Owls',e:'🦉',need:1,r:'Diamond+',d:'K/D 1.2+ · mic on · no tilt',m:['🦊','🐍','🎯']},{n:'Ascent Grinders',e:'🔥',need:2,r:'Plat–Ascendant',d:'ACS 220+ · chill comms',m:['🌸','⚡']},{n:'Sunday Stack',e:'☀️',need:1,r:'Gold+',d:'Win-focused, weekends',m:['🛡️','🎯','🦊']}];
const DT=[{n:'Aarav, 24',e:'🧑‍🚀',g:'Valorant · CS2',b:'Radiant dreams, Gold reality. Will carry you in rom-coms.',y:1},{n:'Meera, 22',e:'👩‍🎤',g:'Apex · Valorant',b:'Sage main. I heal, I clutch, I judge your crosshair.',y:0},{n:'Zoya, 25',e:'🧝',g:'Overwatch · Valorant',b:'Looking for a duo for ranked and for life.',y:1},{n:'Dev, 23',e:'🧙',g:'CS2 · Valorant',b:'Anti-toxic. Pro-snacks. Pizza after every win.',y:0},{n:'Sam, 26',e:'🦸',g:'Valorant',b:'Controller main. I smoke problems away.',y:1}];
const ST=['You','NovaKai','Riya','Vik','Sam','Zoya'],SE=['➕','🦊','🌸','🐍','🛡️','🧝'];
const FD=[{u:'ViperVik',e:'🐍',g:'Valorant',t:'Ace on Ascent, 1v5 clutch 🔥',bg:'linear-gradient(135deg,#7c5cff,#ff4d8d)',i:'🎬',l:214,c:18},{u:'SageMain_Riya',e:'🌸',g:'Valorant',t:'Hit Ascendant today. Thanks to my duo!',bg:'linear-gradient(135deg,#1fb86b,#2d7cff)',i:'🏆',l:98,c:9}];
const BD={Valorant:[['Best Jett crosshair settings for 2026?',48,22],['LFG: need a 5th for Immortal lobby',31,12]],CS2:[['Mirage smokes every player should know',77,30]],Apex:[['Ranked split meta tier list',29,14]],'Overwatch':[['Support mains, how do you cope?',63,41]]};
let CV=[{id:1,n:'NovaKai',e:'🦊',k:'dm',m:[['t','gg, queue again?'],['t','I’ll bring the Op 😎']]},{id:2,n:'Night Owls',e:'🦉',k:'gr',m:[['t','Vik: scrim at 9pm?']]},{id:3,n:'ViperVik',e:'🐍',k:'rq',m:[['t','Hey! Saw your stats, wanna duo?']]},{id:4,n:'ClutchOrNothing',e:'🎯',k:'rq',m:[['t','yo add me']]}];
const S={tab:'feed',sub:'p',ob:0,likes:5,prem:false,party:[],rank:0,kd:0,acs:0,role:'Any',board:'Valorant',di:0,cs:'dm',chat:null,stars:5,dark:null,mine:{rt:4.7,rv:12},rid:'Torcurry#2moro',st:{r:3,d:3,kd:'0.96',adr:'138.3',hs:'39.3',wr:'35.7',acs:'209.6',pk:'Ascendant 1',real:1},posts:[...FD],liked:{},req:3,seen:{},my:[],camOK:0,perm:{cam:'ask',mic:'ask',loc:'ask',sto:'ask'},loc:null,set:{thm:'System',priv:0,stat:1,act:1,read:1,dm:'Everyone',hide:1,dis:1,show:'Everyone',age:'18–30',nl:1,nm:1,np:1,nmatch:1,quiet:0,nolim:1,sens:1,auto:1,saver:0,twofa:0}};
const $=x=>document.querySelector(x),A=$('#app');
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)}
function M(h){const m=$('#modal');m.innerHTML=h?'<div>'+h+'</div>':'';m.classList.toggle('on',!!h)}
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
function render(){if(S.ob<3){$('#nav').classList.remove('show');return onb()}$('#nav').classList.add('show');
const T=[['feed','🏠','Home'],['team','⚔️','Squad'],['date','💘','Dating'],['up','＋',''],['chat','💬','Chat'],['forum','📚','Forums'],['me','👤','Me']];
const N=$('#nav');const tb=S.tab=='set'?'me':S.tab;N.style.setProperty('--i',T.findIndex(t=>t[0]==tb));[...N.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',T[i][0]==tb));if(!N.firstChild)N.innerHTML='<i class="pill"></i>'+T.map(t=>`<button class="${S.tab==t[0]?'on':''} ${t[0]=='up'?'plus':''}" data-a="tab" data-v="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');const an=S.anim;S.anim=0;A.innerHTML='<main id="pg" class="'+(an?'':'still')+'">'+({feed,team,date,chat,forum,me,set:setp}[S.tab])()+'</main>';if(an){scrollTo(0,0);A.scrollTop=0;cnt();[...$('#pg').children].forEach((c,i)=>c.style.animationDelay=Math.min(i,8)*60+'ms')}}
function cnt(){document.querySelectorAll('#pg .stats b').forEach(b=>{const t=b.textContent,n=parseFloat(t),s=t.replace(/[\d.]/g,''),d=(t.split('.')[1]||'').replace(/\D/g,'').length;let st=null;const f=ts=>{st=st||ts;const p=Math.min((ts-st)/700,1);b.textContent=(n*(1-Math.pow(1-p,3))).toFixed(d)+s;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function sd(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function linked(){const s=S.st;return `<div class="row wrap" style="justify-content:center;margin-top:8px"><span class="tag rk">${RK[s.r]} ${s.d}</span>${s.pk?'<span class="tag">Peak '+s.pk+'</span>':''}<span class="tag">${S.rid} ✓</span><span class="tag">tracker.gg linked ✓</span></div><div class="stats"><div><b>${s.kd}</b><small>K/D</small></div><div><b>${s.adr}</b><small>ADR</small></div><div><b>${s.hs}%</b><small>HS</small></div><div><b>${s.wr}%</b><small>Win</small></div><div><b>${s.acs}</b><small>ACS</small></div></div><button class="chip" data-a="unlink">Unlink</button><p class="mu" style="margin-top:8px">${s.real?'Real stats from your tracker.gg: V26: A5 competitive, 14 matches. Main: Chamber.':'Demo stats generated from your ID. Live data needs Riot’s official API.'}</p>`}
function linkcard(){return `<div class="card"><h2>🔗 Link your accounts</h2><p class="mu" style="margin:6px 0 10px">Enter your Riot ID to show stats on your profile.</p><input type="text" id="rid" placeholder="Riot ID, e.g. Name#1234"><div id="ls" class="mu" style="margin:8px 0"></div><div class="bar"><i id="lb"></i></div><button class="btn w" id="lbt" data-a="link">Link Riot ID + tracker.gg</button></div>`}
function onb(){let h='';
if(S.ob==0)h=`<div class="hero"><div><div style="font-size:64px">🎮</div><h1>SquadLink</h1><p class="mu" style="margin:8px 0 18px">Find the right duo, trio or fifth. Win more. Make friends. Maybe more.</p>
<button class="btn w" data-a="ob1">Continue with Google</button><button class="btn g w" data-a="ob1">Continue with Facebook</button>
<p class="mu" style="margin-top:14px">18+ only · Face check required · We never store your face photo</p></div></div>`;
else if(S.ob==1)h=`<div class="hero"><div><h1>Quick face check</h1><p class="mu">Proves you’re a real person, matches your photos and confirms you’re 18+.</p><div class="ring"><s>🙂</s></div><div class="bar"><i id="pb"></i></div><p id="ps" class="mu" style="margin:10px 0">Ready when you are.</p><button id="sb" class="btn w" data-a="scan">Start scan</button><p class="mu" style="margin-top:10px">🔒 Consent-based · Only a pass/fail result is kept · Delete anytime</p></div></div>`;
else h=`<div class="hero"><div><div style="font-size:64px">✅</div><h1>You’re verified!</h1><p class="mu" style="margin:8px 0">Live person ✓ Matches photos ✓ Estimated age 21+ ✓<br>No ID needed. (Borderline ages would get a quick ID check.)</p><button class="btn w" data-a="enter">Enter SquadLink</button></div></div>`;
A.innerHTML='<main>'+h+'</main>'}
function feed(){return `<div class="tabs" style="gap:12px">${ST.map((s,i)=>`<div class="story ${S.seen[i]?'seen':''}" data-a="story" data-v="${i}"><i>${i==0&&S.my.length?'😎':SE[i]}</i>${s}</div>`).join('')}</div>
<div class="card"><textarea id="np" placeholder="Share a clip, screenshot or achievement…"></textarea><div class="row sp" style="margin-top:8px"><span class="mu">📎 From game, phone or PC</span><button class="btn" data-a="post">Post</button></div></div>`+S.posts.map((p,i)=>`<div class="card"><div class="row"><div class="av">${p.e}</div><div class="grow"><div class="nm">${p.u}</div><div class="mu">${p.g}</div></div></div><div class="img" style="background:${p.bg||'#111'}">${p.m?pm(p.m,'p')+ovw(p.m):p.i}</div><p>${p.t}</p><div class="row" style="margin-top:8px"><button class="chip ${S.liked[i]?'on':''}" data-a="like" data-v="${i}">❤️ ${p.l+(S.liked[i]?1:0)}</button><span class="chip">💬 ${p.c}</span></div></div>`).join('')}
function team(){return `<div class="card row sp wrap"><div class="grow"><h2>Your party ${1+S.party.length}/3</h2><div class="mu">Ranked allows max 3. Pick wisely.</div><div class="row" style="margin-top:6px"><div class="av">😎</div>${S.party.map(i=>`<div class="av">${PL[i].e}</div>`).join('')}</div></div>${S.party.length?'<button class="btn ok" data-a="finish">Finish match</button>':''}</div>
